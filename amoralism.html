<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amoralism — aquam3ss</title>
<style>
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  #scene{
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    touch-action: none;
    outline: none;
  }
  #scene.dragging{
    cursor: grabbing;
  }
  .hint{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: lowercase;
    color: rgba(255,255,255,0.5);
    pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 10;
  }
  .hint.hidden{
    opacity: 0;
  }
  .home-link{
    position: fixed;
    top: 24px;
    left: 32px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    color: #ff0000;
    text-decoration: none;
    z-index: 20;
  }

</style>
</head>
<body>

<a class="home-link" href="index.html">&larr; aquam3ss</a>

<canvas id="scene" tabindex="0"></canvas>
<div class="hint" id="hint">dra för att titta runt &middot; piltangenter / wasd för att gå</div>

<script src="three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('scene');
  const hint = document.getElementById('hint');

  // --- basic scene setup ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.rotation.order = 'YXZ'; // yaw then pitch, avoids gimbal roll for look-around controls
  camera.position.set(0, 1.6, 3.2); // stand roughly in the middle of the room, eye height

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // --- room dimensions ---
  const ROOM_W = 10;
  const ROOM_D = 10;
  const ROOM_H = 4;

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x0e0e12, roughness: 0.95, metalness: 0 });
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.85, metalness: 0 });
  const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x070707, roughness: 1, metalness: 0 });

  // floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  scene.add(floor);

  // ceiling
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilingMat);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = ROOM_H;
  scene.add(ceiling);

  // back wall (the gallery wall the paintings hang on) — at -Z, camera looks toward it initially
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat);
  backWall.position.set(0, ROOM_H / 2, -ROOM_D / 2);
  scene.add(backWall);

  // front wall
  const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), wallMat);
  frontWall.position.set(0, ROOM_H / 2, ROOM_D / 2);
  frontWall.rotation.y = Math.PI;
  scene.add(frontWall);

  // left wall
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, ROOM_H), wallMat);
  leftWall.position.set(-ROOM_W / 2, ROOM_H / 2, 0);
  leftWall.rotation.y = Math.PI / 2;
  scene.add(leftWall);

  // right wall
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, ROOM_H), wallMat);
  rightWall.position.set(ROOM_W / 2, ROOM_H / 2, 0);
  rightWall.rotation.y = -Math.PI / 2;
  scene.add(rightWall);

  // --- lighting: dark room, bright focused pools of light only on the paintings ---
  scene.add(new THREE.AmbientLight(0xffffff, 0.22)); // keeps the room legible without losing the black-box feel

  const dimFill = new THREE.DirectionalLight(0xaab4c0, 0.22);
  dimFill.position.set(-2, ROOM_H - 0.5, 2);
  scene.add(dimFill);

  // one spotlight per painting, added after painting positions are known below

  // one painting per wall — back, left, right — each with its own spotlight.
  // aspect = real width/height of the photographed canvas, so it hangs undistorted.
  const paintingDefs = [
    { src: 'tavla1_standing.jpg', aspect: 0.695, wall: 'back',
      title: '[titel 1]', size: '[mått]', technique: '[teknik]' },
    { src: 'tavla2_fallen_wide.jpg', aspect: 0.799, wall: 'left',
      title: '[titel 2]', size: '[mått]', technique: '[teknik]' },
    { src: 'tavla3_fallen_close.jpg', aspect: 0.793, wall: 'right',
      title: '[titel 3]', size: '[mått]', technique: '[teknik]' },
  ];

  const PAINTING_H = 1.9; // fixed display height; width is derived per-painting from its own aspect ratio
  const PAINTING_Y = 1.7;
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.6 });
  const textureLoader = new THREE.TextureLoader();

  // for each wall: where the painting sits (position + rotation.y so its front
  // face points into the room), where the ceiling spotlight + its aim point go,
  // and sideVec — the direction a viewer facing the painting would call "their right",
  // used to place the little wall-label plaque beside it
  function wallPlacement(wall){
    if (wall === 'back'){
      return {
        paintingPos: new THREE.Vector3(0, PAINTING_Y, -ROOM_D / 2 + 0.03),
        framePos:    new THREE.Vector3(0, PAINTING_Y, -ROOM_D / 2 + 0.02),
        rotationY: 0,
        lightPos: new THREE.Vector3(0, ROOM_H - 0.3, -ROOM_D / 2 + 2.4),
        sideVec: new THREE.Vector3(1, 0, 0),
      };
    }
    if (wall === 'left'){
      return {
        paintingPos: new THREE.Vector3(-ROOM_W / 2 + 0.03, PAINTING_Y, 0),
        framePos:    new THREE.Vector3(-ROOM_W / 2 + 0.02, PAINTING_Y, 0),
        rotationY: Math.PI / 2,
        lightPos: new THREE.Vector3(-ROOM_W / 2 + 2.4, ROOM_H - 0.3, 0),
        sideVec: new THREE.Vector3(0, 0, 1),
      };
    }
    // right
    return {
      paintingPos: new THREE.Vector3(ROOM_W / 2 - 0.03, PAINTING_Y, 0),
      framePos:    new THREE.Vector3(ROOM_W / 2 - 0.02, PAINTING_Y, 0),
      rotationY: -Math.PI / 2,
      lightPos: new THREE.Vector3(ROOM_W / 2 - 2.4, ROOM_H - 0.3, 0),
      sideVec: new THREE.Vector3(0, 0, -1),
    };
  }

  // draws a small white wall-label plaque (title / mått / teknik) onto a canvas texture
  function makeLabelTexture(title, size, technique){
    const c = document.createElement('canvas');
    c.width = 512; c.height = 300;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#111111';
    ctx.textBaseline = 'top';
    ctx.font = '600 34px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText(title, 30, 36);
    ctx.fillStyle = '#555555';
    ctx.font = '26px "Helvetica Neue", Arial, sans-serif';
    ctx.fillText(size, 30, 108);
    ctx.fillText(technique, 30, 150);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  paintingDefs.forEach((def) => {
    const place = wallPlacement(def.wall);
    const w = PAINTING_H * def.aspect;

    // frame (slightly larger dark plane, sits just behind the canvas against the wall)
    const frame = new THREE.Mesh(
      new THREE.PlaneGeometry(w + 0.14, PAINTING_H + 0.14),
      frameMat
    );
    frame.position.copy(place.framePos);
    frame.rotation.y = place.rotationY;
    scene.add(frame);

    // the actual artwork photo
    const tex = textureLoader.load(def.src);
    tex.colorSpace = THREE.SRGBColorSpace;
    const canvasMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
    const painting = new THREE.Mesh(new THREE.PlaneGeometry(w, PAINTING_H), canvasMat);
    painting.position.copy(place.paintingPos);
    painting.rotation.y = place.rotationY;
    scene.add(painting);

    // focused ceiling spotlight aimed at this painting — the only real light source
    const spot = new THREE.SpotLight(0xfff2df, 26, 11, 0.5, 0.65, 1.3);
    spot.position.copy(place.lightPos);
    spot.target.position.copy(place.paintingPos);
    scene.add(spot);
    scene.add(spot.target);

    // small white wall-label plaque to the right of the painting — title / mått / teknik
    const LABEL_W = 0.4;
    const LABEL_H = 0.4 * (300 / 512);
    const labelTex = makeLabelTexture(def.title, def.size, def.technique);
    const labelMat = new THREE.MeshBasicMaterial({ map: labelTex }); // unlit, always reads as a clean white plaque
    const label = new THREE.Mesh(new THREE.PlaneGeometry(LABEL_W, LABEL_H), labelMat);
    const labelPos = place.paintingPos.clone()
      .addScaledVector(place.sideVec, w / 2 + 0.18 + LABEL_W / 2);
    labelPos.y = PAINTING_Y - PAINTING_H / 2 + 0.18; // lower than the painting, roughly eye/waist height
    label.position.copy(labelPos);
    label.rotation.y = place.rotationY;
    scene.add(label);
  });

  // --- look-around controls: drag rotates the camera in place (no movement) ---
  let dragging = false;
  let lastX = 0, lastY = 0;
  let yaw = 0;   // radians, camera already faces -Z (toward the paintings) by default
  let pitch = 0;

  const ROTATE_SPEED = 0.0035;
  const PITCH_LIMIT = Math.PI / 2 - 0.15;

  function pointerDown(x, y){
    dragging = true;
    lastX = x; lastY = y;
    canvas.classList.add('dragging');
    hint.classList.add('hidden');
  }
  function pointerMove(x, y){
    if (!dragging) return;
    const dx = x - lastX;
    const dy = y - lastY;
    lastX = x; lastY = y;
    yaw -= dx * ROTATE_SPEED;
    pitch -= dy * ROTATE_SPEED;
    pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }
  function pointerUp(){
    dragging = false;
    canvas.classList.remove('dragging');
  }

  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointerDown(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener('pointerup', pointerUp);

  // --- walk controls: WASD / arrow keys move through the room, drag still just looks around ---
  const keys = new Set();
  const KEY_MAP = {
    'KeyW': 'forward', 'ArrowUp': 'forward',
    'KeyS': 'backward', 'ArrowDown': 'backward',
    'KeyA': 'left', 'ArrowLeft': 'left',
    'KeyD': 'right', 'ArrowRight': 'right',
  };
  window.addEventListener('keydown', (e) => {
    const action = KEY_MAP[e.code];
    if (action){ keys.add(action); hint.classList.add('hidden'); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    const action = KEY_MAP[e.code];
    if (action) keys.delete(action);
  });

  const MOVE_SPEED = 2.4; // units per second
  const WALL_MARGIN = 0.3; // how close the camera may get to a wall/painting before stopping

  function updateMovement(dt){
    if (keys.size === 0) return;
    // forward/right vectors from yaw only, so looking up/down doesn't tip movement into the floor or ceiling
    const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    const move = new THREE.Vector3();
    if (keys.has('forward')) move.add(forward);
    if (keys.has('backward')) move.sub(forward);
    if (keys.has('right')) move.add(right);
    if (keys.has('left')) move.sub(right);

    if (move.lengthSq() > 0){
      move.normalize().multiplyScalar(MOVE_SPEED * dt);
      camera.position.add(move);
      const half = { x: ROOM_W / 2 - WALL_MARGIN, z: ROOM_D / 2 - WALL_MARGIN };
      camera.position.x = Math.max(-half.x, Math.min(half.x, camera.position.x));
      camera.position.z = Math.max(-half.z, Math.min(half.z, camera.position.z));
    }
  }

  // --- resize ---
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // --- render loop ---
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1); // clamp to avoid big jumps after a tab is backgrounded
    updateMovement(dt);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>

</body>
</html>
