<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRUNK</title>
  <style>
    :root {
      --bg: #221f20;
      --text: #e8e6df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Archivo", system-ui, sans-serif;
      overflow: hidden;
    }

    .hero {
      position: relative;
      z-index: 0;
      height: 100vh;
      width: 100%;
    }

    .back {
      position: fixed;
      z-index: 10;
      top: 24px;
      left: 28px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      opacity: 0.7;
    }
    .back:hover { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="/">← aquam3ss</a>

  <main class="hero">
    <!-- Ny grafik kommer här -->
  </main>
</body>
</html>
