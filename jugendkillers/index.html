<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jugend Killers — aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background:#ffffff;
    color:#111;
    font-family:"Manrope", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .home-link{
    position:fixed;
    top:24px;
    left:32px;
    z-index:50;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:lowercase;
    color:#ff0000;
    text-decoration:none;
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }

  /* --- full-bleed intro hero --- */
  .p-hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#fafafa;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .p-hero .ph-label{
    font-size:11px;
    letter-spacing:0.06em;
    color:#b98096;
    text-transform:lowercase;
  }
  .p-hero-title-block{
    position:absolute;
    left:32px;
    bottom:40px;
    z-index:5;
  }
  .p-hero-title{
    font-size:clamp(28px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:#ff0000;
    margin:0;
  }

  /* --- text section --- */
  .details{
    padding:96px 32px 120px;
    text-align:center;
  }
  .details-text{
    font-size:16px;
    line-height:1.5;
    max-width:420px;
    margin:0 auto;
  }
  .details-text p{ margin:0; }

  @media (max-width:700px){
    .details{ padding:64px 20px 96px; }
  }
</style>
</head>
<body>

<a class="home-link" href="/">← aquam3ss</a>

<section class="p-hero">
  <span class="ph-label">bilder kommer</span>
  <div class="p-hero-title-block">
    <h1 class="p-hero-title">Jugend Killers</h1>
  </div>
</section>

<section class="details">
  <div class="details-text">
    <p>text kommer</p>
  </div>
</section>

</body>
</html>
