<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --grey: #a3a3a3;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: #111;
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- persistent nav overlay: about (top-left) + project list, contact (top-right) --- */
  .nav-invert{
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
  }
  .nav-invert a{
    color: #ff0000;
    text-decoration: none;
    pointer-events: auto;
  }
  .nav-about{
    position: absolute;
    top: 24px;
    left: 32px;
    text-transform: none;
  }
  .nav-contact{
    position: absolute;
    top: 24px;
    right: 32px;
  }
  .nav-projects{
    position: fixed;
    top: 64px;
    left: 32px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: none;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
  }
  .nav-projects a{
    color: #ff0000;
    text-decoration: none;
  }

  /* --- hero: grey name in the background, spinning avatar on top --- */
  .hero-scroll{
    position: relative;
    height: 300vh; /* scroll distance that drives one full spin */
  }
  .hero-sticky{
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
  }

  .hero-text{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
    pointer-events: none;
  }
  .hero-text span{
    font-size: clamp(48px, 12vw, 180px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--grey);
  }

  .avatar{
    position: relative;
    z-index: 1;
    height: 82vh;
    width: auto;
    max-width: 92vw;
    display: block;
    mix-blend-mode: multiply;   /* white background disappears, blue lines stay */
    transform-style: preserve-3d;
    will-change: transform;
    pointer-events: none;
  }

  .scroll-hint{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: lowercase;
    color: #fff;
    mix-blend-mode: difference;
    z-index: 40;
    transition: opacity 0.4s ease;
  }

</style>
</head>
<body>

  <div class="nav-invert">
    <a class="nav-about" href="/about/">About</a>
    <a class="nav-contact" href="mailto:julia.blombergg@gmail.com">contact</a>
  </div>
  <nav class="nav-projects">
    <a href="/rave-ban/">Rave-Ban</a>
    <a href="/theredforest/">The red forest</a>
    <a href="/wickedproblems/">Wickedproblems</a>
    <a href="https://stuckholm.se" target="_blank" rel="noopener">Stuckholm</a>
    <a href="/skrap/">Skräp</a>
  </nav>

  <section class="hero-scroll" id="heroScroll">
    <div class="hero-sticky">

      <div class="hero-text">
        <span>@aquam3ss</span>
      </div>

      <img class="avatar" id="avatar" src="avatar.png" alt="Avatar av Julia">

    </div>
  </section>

  <div class="scroll-hint" id="scrollHint">scrolla ner ↓</div>

<script>
(function(){
  const wrapper    = document.getElementById('heroScroll');
  const avatar     = document.getElementById('avatar');
  const scrollHint = document.getElementById('scrollHint');

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function update(){
    const rect = wrapper.getBoundingClientRect();
    const scrollable = wrapper.offsetHeight - window.innerHeight;
    const scrolled = clamp(-rect.top, 0, scrollable);
    const overall = scrollable > 0 ? scrolled / scrollable : 0;

    // one full turn (360deg) across the scroll distance
    avatar.style.transform = `rotateY(${overall * 360}deg)`;

    scrollHint.style.opacity = overall > 0.03 ? '0' : '1';
  }

  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking){
      requestAnimationFrame(() => { update(); ticking = false; });
      ticking = true;
    }
  }, { passive: true });

  window.addEventListener('resize', update);
  update();
})();
</script>

</body>
</html>
