<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rave-Ban</title>
  <style>
    :root {
      --bg: #221f20;
      --text: #e8e6df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Archivo", system-ui, sans-serif;
    }

    /* scroll distance that drives one full spin */
    .hero-scroll {
      position: relative;
      height: 900vh;
    }

    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      perspective: 1400px;
      overflow: hidden;
    }

    .avatar {
      height: 82vh;
      width: auto;
      max-width: 92vw;
      display: block;
      will-change: transform;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* --- 3D product viewer, drag to turn, scroll/pinch to zoom --- */
    .viewer {
      position: relative;
      height: 100vh;
      width: 100%;
    }
    #viewer-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #viewer-canvas:active { cursor: grabbing; }
    .viewer-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.08em;
      opacity: 0.55;
      pointer-events: none;
    }

    .back {
      position: fixed;
      z-index: 10;
      top: 24px;
      left: 28px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      opacity: 0.7;
    }
    .back:hover { opacity: 1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a class="back" href="/">← aquam3ss</a>

  <section class="hero-scroll" id="heroScroll">
    <main class="hero">
      <img class="avatar" id="avatar" src="avatar.png" alt="Avatar av Julia">
    </main>
  </section>

  <section class="viewer">
    <canvas id="viewer-canvas" aria-label="3D-modell av glasögonen"></canvas>
    <div class="viewer-hint">dra för att vrida · scrolla för att zooma</div>
  </section>

  <script>
    (function () {
      var wrapper = document.getElementById("heroScroll");
      var avatar  = document.getElementById("avatar");

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

      function update() {
        var rect = wrapper.getBoundingClientRect();
        var scrollable = wrapper.offsetHeight - window.innerHeight;
        var scrolled = clamp(-rect.top, 0, scrollable);
        var overall = scrollable > 0 ? scrolled / scrollable : 0;
        // one full turn (360deg) across the scroll distance
        avatar.style.transform = "rotateY(" + (overall * 360) + "deg)";
      }

      var ticking = false;
      window.addEventListener("scroll", function () {
        if (!ticking) {
          requestAnimationFrame(function () { update(); ticking = false; });
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener("resize", update);
      update();
    })();
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    var canvas = document.getElementById("viewer-canvas");
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    var scene = new THREE.Scene();
    var pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    var camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);

    var controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 0.3;
    controls.maxDistance = 20;

    function resize() {
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    var loader = new GLTFLoader();
    loader.load("model.glb", function (gltf) {
      var model = gltf.scene;
      scene.add(model);

      // center the model and fit the camera to it
      var box = new THREE.Box3().setFromObject(model);
      var size = box.getSize(new THREE.Vector3());
      var center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);

      var radius = Math.max(size.x, size.y, size.z) / 2;
      var dist = radius / Math.sin((camera.fov * Math.PI / 180) / 2);
      camera.position.set(0, 0, dist * 1.1);
      controls.target.set(0, 0, 0);
      controls.update();
    }, undefined, function (err) {
      console.error("Kunde inte ladda modellen:", err);
    });

    var light = new THREE.DirectionalLight(0xffffff, 0.6);
    light.position.set(2, 3, 4);
    scene.add(light);

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
