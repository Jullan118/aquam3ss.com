<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rave-Ban</title>
  <style>
    :root {
      --bg: #221f20;
      --text: #e8e6df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Archivo", system-ui, sans-serif;
    }

    /* scroll distance that drives one full spin */
    .hero-scroll {
      position: relative;
      height: 900vh;
    }

    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: grid;
      place-items: center;
      perspective: 1400px;
      overflow: hidden;
    }

    .avatar {
      height: 82vh;
      width: auto;
      max-width: 92vw;
      display: block;
      will-change: transform;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .back {
      position: fixed;
      z-index: 10;
      top: 24px;
      left: 28px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      opacity: 0.7;
    }
    .back:hover { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="/">← aquam3ss</a>

  <section class="hero-scroll" id="heroScroll">
    <main class="hero">
      <img class="avatar" id="avatar" src="avatar.png" alt="Avatar av Julia">
    </main>
  </section>

  <script>
    (function () {
      var wrapper = document.getElementById("heroScroll");
      var avatar  = document.getElementById("avatar");

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

      function update() {
        var rect = wrapper.getBoundingClientRect();
        var scrollable = wrapper.offsetHeight - window.innerHeight;
        var scrolled = clamp(-rect.top, 0, scrollable);
        var overall = scrollable > 0 ? scrolled / scrollable : 0;
        // one full turn (360deg) across the scroll distance
        avatar.style.transform = "rotateY(" + (overall * 360) + "deg)";
      }

      var ticking = false;
      window.addEventListener("scroll", function () {
        if (!ticking) {
          requestAnimationFrame(function () { update(); ticking = false; });
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener("resize", update);
      update();
    })();
  </script>
</body>
</html>
