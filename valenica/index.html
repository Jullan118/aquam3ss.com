<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valenica — aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background:#ffffff;
    color:#111;
    font-family:"Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .home-link{
    position:fixed;
    top:24px;
    left:32px;
    z-index:50;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:lowercase;
    color:#ff0000;
    text-decoration:none;
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }

  .p-hero{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 32px;
  }
  .p-title{
    position:absolute;
    left:32px;
    bottom:40px;
    z-index:5;
    font-size:clamp(28px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:#ff0000;
    margin:0;
  }

  .carousel{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    text-align:center;
    user-select:none;
  }
  .carousel-stage{
    position:relative;
    width:100%;
    height:76vh;
    min-height:320px;
  }
  .carousel-stage img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 0.35s ease;
  }
  .carousel-stage img.active{ opacity:1; }
  .carousel-prev, .carousel-next{
    position:absolute;
    top:0;
    height:100%;
    width:40%;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
  }
  .carousel-prev{ left:0; }
  .carousel-next{ right:0; }
  .carousel-dots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
  }
  .carousel-dots button{
    width:8px;
    height:8px;
    border-radius:50%;
    border:0;
    padding:0;
    background:#cfcfcf;
    cursor:pointer;
  }
  .carousel-dots button.active{ background:#111; }

  .info{
    padding:48px 32px 120px;
    text-align:center;
    color:#111;
  }
  .caption{
    margin:0;
    font-size:15px;
    line-height:1.5;
  }
  .story{
    max-width:640px;
    margin:56px auto 0;
    font-size:15px;
    line-height:1.6;
  }
  .story p{ margin:0 0 20px; }
  .story p:last-child{ margin-bottom:0; }

  @media (max-width:700px){
    .p-hero{ padding:0 20px; }
    .carousel-stage{ height:60vh; min-height:260px; }
    .p-title{ left:20px; }
    .info{ padding:40px 20px 96px; }
  }
</style>
</head>
<body>

<a class="home-link" href="/">← aquam3ss</a>

<section class="p-hero">
  <div class="carousel" id="carousel">
    <div class="carousel-stage">
      <img class="active" src="valenica-1.jpg" alt="Valenica, uppifrån">
      <img src="valenica-2.jpg" alt="Valenica på sin bas, vinkelbild">
      <img src="valenica-3.jpg" alt="Valenica på sin bas, vinkelbild från andra sidan">
      <img src="valenica-4.jpg" alt="Valenica, sidovy">
      <button class="carousel-prev" aria-label="Föregående bild"></button>
      <button class="carousel-next" aria-label="Nästa bild"></button>
    </div>
    <div class="carousel-dots">
      <button class="active" aria-label="Bild 1"></button>
      <button aria-label="Bild 2"></button>
      <button aria-label="Bild 3"></button>
      <button aria-label="Bild 4"></button>
    </div>
  </div>
  <h1 class="p-title">Valenica</h1>
</section>

<section class="info">
  <div class="story">
    <p>With orange trees woven into the city's urban landscape, Valencia's iconic fruit became the foundation for my final project during my bachelor's exchange.</p>
  </div>
</section>

<script>
(function(){
  var root = document.getElementById('carousel');
  var imgs = root.querySelectorAll('.carousel-stage img');
  var dots = root.querySelectorAll('.carousel-dots button');
  var i = 0;

  function show(n){
    i = (n + imgs.length) % imgs.length;
    imgs.forEach(function(el, k){ el.classList.toggle('active', k === i); });
    dots.forEach(function(el, k){ el.classList.toggle('active', k === i); });
  }

  root.querySelector('.carousel-prev').addEventListener('click', function(){ show(i - 1); });
  root.querySelector('.carousel-next').addEventListener('click', function(){ show(i + 1); });
  dots.forEach(function(el, k){ el.addEventListener('click', function(){ show(k); }); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
})();
</script>

</body>
</html>
