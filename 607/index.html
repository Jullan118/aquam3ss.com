<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>607 — aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background:#ffffff;
    color:#111;
    font-family:"Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .home-link{
    position:fixed;
    top:24px;
    left:32px;
    z-index:50;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:lowercase;
    color:#ff0000;
    text-decoration:none;
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }

  /* --- full-bleed intro hero --- */
  .p-hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  .p-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .p-hero-title-block{
    position:absolute;
    left:32px;
    bottom:40px;
    z-index:5;
  }
  .p-hero-title{
    font-size:clamp(28px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:#ff0000;
    margin:0;
  }
  .p-hero-caption{
    margin:6px 0 0;
    font-size:15px;
    line-height:1.4;
    color:#111;
  }

  /* --- row of three photos --- */
  .photos{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    padding:96px 32px 0;
  }
  .photos img{
    width:100%;
    height:auto;
    display:block;
    aspect-ratio:2 / 3;
    object-fit:cover;
  }

  /* --- drawing left, text right --- */
  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    padding:96px 32px 120px;
    align-items:center;
  }
  .details img{
    width:100%;
    height:auto;
    display:block;
  }
  .details-text{
    text-align:center;
    font-size:16px;
    line-height:1.5;
    max-width:420px;
    margin:0 auto;
  }
  .details-text h2{
    font-size:16px;
    font-weight:700;
    margin:0 0 16px;
  }
  .details-text p{ margin:0; }

  @media (max-width:700px){
    .photos{ grid-template-columns:1fr; padding:64px 20px 0; }
    .details{ grid-template-columns:1fr; padding:64px 20px 96px; }
  }
</style>
</head>
<body>

<a class="home-link" href="/">← aquam3ss</a>

<section class="p-hero">
  <img src="607-hero.jpg" alt="607, skugga av häst och person på ljus bakgrund">
  <div class="p-hero-title-block">
    <h1 class="p-hero-title">607</h1>
    <p class="p-hero-caption">collab 2025, snus box in aluminum.</p>
  </div>
</section>

<section class="photos">
  <img src="607-1.png" alt="607, stängd dosa">
  <img src="607-2.png" alt="607, öppen dosa med snus">
  <img src="607-3.png" alt="607, dosa i handen med röd tätningsring">
</section>

<section class="details">
  <img src="607-4.png" alt="607, teknisk ritning av dosan, dosa5">
  <div class="details-text">
    <h2>607</h2>
    <p>The shape of classic snus box in aluminum that spins when placed on a table. Motion solved through a ball bearing between the body and base.</p>
  </div>
</section>

</body>
</html>
