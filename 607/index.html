<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>607 — aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background:#ffffff;
    color:#111;
    font-family:"Archivo", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .home-link{
    position:fixed;
    top:24px;
    left:32px;
    z-index:50;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:lowercase;
    color:#ff0000;
    text-decoration:none;
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }

  /* --- full-bleed intro hero (same treatment as wickedproblems) --- */
  .p-hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  .p-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .p-hero-title{
    position:absolute;
    left:32px;
    bottom:40px;
    z-index:5;
    font-size:clamp(28px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:#ff0000;
    margin:0;
  }

  /* --- carousel + text --- */
  .project{
    padding:96px 32px 120px;
    text-align:center;
  }
  .carousel{
    position:relative;
    max-width:520px;
    margin:0 auto;
    user-select:none;
  }
  .carousel-stage{
    position:relative;
    width:100%;
    aspect-ratio:2 / 3;
    cursor:pointer;
  }
  .carousel-stage img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 0.35s ease;
  }
  .carousel-stage img.active{ opacity:1; }
  .carousel-prev, .carousel-next{
    position:absolute;
    top:0;
    height:100%;
    width:40%;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
  }
  .carousel-prev{ left:0; }
  .carousel-next{ right:0; }
  .carousel-dots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
  }
  .carousel-dots button{
    width:8px;
    height:8px;
    border-radius:50%;
    border:0;
    padding:0;
    background:#cfcfcf;
    cursor:pointer;
  }
  .carousel-dots button.active{ background:#111; }

  .text{
    max-width:640px;
    margin:72px auto 0;
    font-size:16px;
    line-height:1.5;
  }

  @media (max-width:700px){
    .project{ padding:64px 20px 96px; }
  }
</style>
</head>
<body>

<a class="home-link" href="/">← aquam3ss</a>

<section class="p-hero">
  <img src="607-hero.jpg" alt="607, skugga av häst och person på ljus bakgrund">
  <h1 class="p-hero-title">607</h1>
</section>

<main class="project">
  <div class="carousel" id="carousel">
    <div class="carousel-stage">
      <img class="active" src="607-1.png" alt="607, stängd dosa">
      <img src="607-2.png" alt="607, öppen dosa med snus">
      <img src="607-3.png" alt="607, dosa i handen med röd tätningsring">
      <button class="carousel-prev" aria-label="Föregående bild"></button>
      <button class="carousel-next" aria-label="Nästa bild"></button>
    </div>
    <div class="carousel-dots">
      <button class="active" aria-label="Bild 1"></button>
      <button aria-label="Bild 2"></button>
      <button aria-label="Bild 3"></button>
    </div>
  </div>

  <p class="text">The shape of classic snus box in aluminum that spins when placed on a table. Motion solved through a ball bearing between the body and base.</p>
</main>

<script>
(function(){
  var root = document.getElementById('carousel');
  var imgs = root.querySelectorAll('.carousel-stage img');
  var dots = root.querySelectorAll('.carousel-dots button');
  var i = 0;

  function show(n){
    i = (n + imgs.length) % imgs.length;
    imgs.forEach(function(el, k){ el.classList.toggle('active', k === i); });
    dots.forEach(function(el, k){ el.classList.toggle('active', k === i); });
  }

  root.querySelector('.carousel-prev').addEventListener('click', function(){ show(i - 1); });
  root.querySelector('.carousel-next').addEventListener('click', function(){ show(i + 1); });
  dots.forEach(function(el, k){ el.addEventListener('click', function(){ show(k); }); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
})();
</script>

</body>
</html>
