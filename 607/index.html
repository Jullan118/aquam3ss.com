<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>607 — aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background:#ffffff;
    color:#111;
    font-family:"Manrope", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .home-link{
    position:fixed;
    top:24px;
    left:32px;
    z-index:50;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:lowercase;
    color:#ff0000;
    text-decoration:none;
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }

  /* --- full-bleed intro hero --- */
  .p-hero{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  .p-hero canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .p-hero-title-block{
    position:absolute;
    left:32px;
    bottom:40px;
    z-index:5;
  }
  .p-hero-title{
    font-size:clamp(28px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:#ff0000;
    margin:0;
  }
  .p-hero-caption{
    margin:6px 0 0;
    font-size:15px;
    line-height:1.4;
    color:#111;
  }

  /* --- row of three photos --- */
  .photos{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    padding:96px 32px 0;
  }
  .photos img{
    width:100%;
    height:auto;
    display:block;
    aspect-ratio:2 / 3;
    object-fit:cover;
  }

  /* --- drawing left, text right --- */
  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    padding:96px 32px 120px;
    align-items:center;
  }
  .details img{
    width:100%;
    height:auto;
    display:block;
  }
  .details-text{
    text-align:center;
    font-size:16px;
    line-height:1.5;
    max-width:420px;
    margin:0 auto;
  }
  .details-text h2{
    font-size:16px;
    font-weight:700;
    margin:0 0 16px;
  }
  .details-text p{ margin:0; }

  @media (max-width:700px){
    .photos{ grid-template-columns:1fr; padding:64px 20px 0; }
    .details{ grid-template-columns:1fr; padding:64px 20px 96px; }
  }
</style>
</head>
<body>

<a class="home-link" href="/">← aquam3ss</a>

<section class="p-hero">
  <canvas id="horse-scene" role="img" aria-label="607, skugga av häst som springer i en cirkel runt personen som håller i linan"></canvas>
  <div class="p-hero-title-block">
    <h1 class="p-hero-title">607</h1>
    <p class="p-hero-caption">collab 2025, snus box in aluminum.</p>
  </div>
</section>

<section class="photos">
  <img src="607-1.png" alt="607, stängd dosa">
  <img src="607-2.png" alt="607, öppen dosa med snus">
  <img src="607-3.png" alt="607, dosa i handen med röd tätningsring">
</section>

<section class="details">
  <img src="607-4.png" alt="607, teknisk ritning av dosan, dosa5">
  <div class="details-text">
    <h2>607</h2>
    <p>The shape of classic snus box in aluminum that spins when placed on a table. Motion solved through a ball bearing between the body and base.</p>
  </div>
</section>


<script>
(function(){
  var canvas = document.getElementById('horse-scene');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var plate = new Image(), horse = new Image();
  var ready = 0;
  function onReady(){ if (++ready === 2) { resize(); requestAnimationFrame(loop); } }
  plate.onload = onReady; horse.onload = onReady;
  plate.src = '607-plate.jpg';
  horse.src = '607-horse.png';

  var IW = 1152, IH = 797;                // photo size
  var HAND = { x: 552, y: 247 };          // the person's hand, the centre of the circle
  var R = 200;                            // lunge-line length: the horse's head stays on this circle
  var HX = 262, HY = 65, SW = 330, SH = 330; // sprite size and the horse's head inside it
  var THETA0 = Math.atan2(85 - 247, 367 - 552); // where the horse starts (its current place)
  var OMEGA = Math.PI * 2 / 9;            // one lap every 9 seconds
  var s = 1, ox = 0, oy = 0, cw = 0, ch = 0, dpr = 1;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = null;

  function resize(){
    var r = canvas.getBoundingClientRect();
    cw = r.width; ch = r.height;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    // same framing as object-fit: cover
    s = Math.max(cw / IW, ch / IH);
    ox = (cw - IW * s) / 2;
    oy = (ch - IH * s) / 2;
    if (reduce) draw(THETA0);
  }

  function toScreen(x, y){ return { x: ox + x * s, y: oy + y * s }; }

  function draw(theta){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(plate, ox, oy, IW * s, IH * s);

    // the horse's head moves on the circle around the hand
    var hx = HAND.x + R * Math.cos(theta);
    var hy = HAND.y + R * Math.sin(theta);
    var bob = reduce ? 0 : Math.sin(theta * 6) * 1.5;   // a small trot bounce
    var flip = Math.sin(theta) > 0;                    // moving left: turn the horse around

    ctx.globalCompositeOperation = 'multiply';

    // the line from the hand to the horse's head
    var a = toScreen(HAND.x, HAND.y), b = toScreen(hx, hy + bob);
    ctx.strokeStyle = 'rgba(40,40,40,0.85)';
    ctx.lineWidth = Math.max(1, 1.3 * s);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    // the horse (with its shadow), anchored at its head
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(s, s);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(horse, -HX, -HY, SW, SH);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(now){
    if (t0 === null) t0 = now;
    draw(THETA0 + (now - t0) / 1000 * OMEGA);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
