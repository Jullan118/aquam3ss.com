<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>avoidant — aquam3ss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background:#ffffff;
    color:#111;
    font-family:"Manrope", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .home-link{
    position:fixed;
    top:24px;
    left:32px;
    z-index:50;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:lowercase;
    color:#ff0000;
    text-decoration:none;
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }

  /* --- full-bleed intro hero --- */
  /* tall track so the hero stays pinned while the glitter dissolves and the screen sweeps to black */
  .glitter-track{
    position:relative;
    height:800vh;
  }
  .sweep-canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:10;
  }
  .ph-logic{
    display:inline-block;
    will-change:transform;
  }
  .p-hero{
    position:sticky;
    top:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  #glitter{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .p-hero-title-block{
    position:absolute;
    left:32px;
    bottom:40px;
  }
  .p-hero-title{
    font-size:clamp(28px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.01em;
    color:#ff0000;
    margin:0;
  }
  /* sentence that appears in the middle of the white page once the glitter is gone */
  .p-hero-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    width:min(960px, 92vw);
    margin:0;
    text-align:center;
    font-size:clamp(14px, 1.45vw, 19px);
    line-height:1.4;
    color:#111;
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  .p-hero-caption{
    margin:6px 0 0;
    font-size:15px;
    line-height:1.4;
    color:#ffffff;
    mix-blend-mode:difference; /* white over dark, black over white */
  }

  /* --- row of three photos --- */
  .photos{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    padding:96px 32px 0;
  }
  .photos img{
    width:100%;
    height:auto;
    display:block;
    aspect-ratio:2 / 3;
    object-fit:cover;
  }

  /* --- drawing left, text right --- */
  .details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    padding:96px 32px 120px;
    align-items:center;
  }
  .details img{
    width:100%;
    height:auto;
    display:block;
  }
  .details-text{
    text-align:center;
    font-size:16px;
    line-height:1.5;
    max-width:420px;
    margin:0 auto;
  }
  .details-text h2{
    font-size:16px;
    font-weight:700;
    margin:0 0 16px;
  }
  .details-text p{ margin:0; }


  @media (max-width:700px){
    .photos{ grid-template-columns:1fr; padding:64px 20px 0; }
    .details{ grid-template-columns:1fr; padding:64px 20px 96px; }
  }
</style>
</head>
<body>

<a class="home-link" href="/">← aquam3ss</a>

<div class="glitter-track">
<section class="p-hero">
  <canvas id="glitter" role="img" aria-label="avoidant, hero"></canvas>
  <canvas id="sweep" class="sweep-canvas" aria-hidden="true"></canvas>
  <div class="p-hero-title-block" id="hero-title">
    <h1 class="p-hero-title">Avoidant</h1>
    <p class="p-hero-caption">Computational design research, 2026, voxel printing</p>
  </div>
  <p class="p-hero-center" id="hero-center"><span class="ph-rest">What happens when you intentionally leave?<br>And what happens when that </span><span class="ph-logic">logic of omission</span><span class="ph-rest"> becomes a material operation, when layers are deliberately left empty inside a voxel print?</span></p>
</section>
</div>



<script>
(function(){
  const hero = document.querySelector('.p-hero');
  const canvas = document.getElementById('glitter');
  const ctx = canvas.getContext('2d');
  const sweep = document.getElementById('sweep');
  const sctx = sweep.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const src = new Image();          // the glitter source
  src.src = 'avoidant-hero.png';
  let isReady = false;

  let items = [];                   // phase 1 glitter
  let W = 0, H = 0, dpr = 1;
  let p = 0, pTarget = 0;           // phase 1: glitter dissolves to white
  let pix = 0;                      // phase 2: the glitter comes back and sweeps the screen to solid black
  let running = false, visible = true, raf = null;

  const centerEl = document.getElementById('hero-center');

  function smooth(a, b, v){
    const x = Math.min(1, Math.max(0, (v - a) / (b - a)));
    return x * x * (3 - 2 * x);
  }

  // deterministic 0..1 value per section, so neighbouring rows dissolve together
  function hash(n){
    const v = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return v - Math.floor(v);
  }

  // Read the glitter source row by row. Long dark runs become horizontal bars
  // that shift together like scan-line glitch; short runs become loose dots.
  function buildGlitter(data){
    const row = Math.max(2, Math.round(W / 500));
    const minBar = row * 3;
    const out = [];
    for (let y = 0; y < H; y += row) {
      const band = Math.floor(y / (row * 9));
      const bandT = hash(band);
      let x = 0;
      while (x < W) {
        const i = (y * W + x) * 4;
        const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        if (lum >= 140) { x++; continue; }
        let x1 = x;
        while (x1 < W) {
          const j = (y * W + x1) * 4;
          const l = 0.299 * data[j] + 0.587 * data[j + 1] + 0.114 * data[j + 2];
          if (l >= 140) break;
          x1++;
        }
        const len = x1 - x;
        const t = 0.6 * bandT + 0.4 * Math.random();
        if (len >= minBar) {
          out.push({
            kind: 'bar', x: x, y: y, w: len, h: row * 0.9,
            ph: Math.random() * Math.PI * 2,
            f: 0.5 + Math.random() * 1.2,
            t: t, band: band,
          });
        } else {
          for (let k = x; k < x1; k += row) {
            out.push({
              kind: 'dot', x: k, y: y,
              ph: Math.random() * Math.PI * 2,
              f1: 0.8 + Math.random() * 2.2,
              f2: 0.6 + Math.random() * 1.6,
              t: 0.5 * bandT + 0.5 * Math.random(),
              sparkle: Math.random() < 0.05,
            });
          }
        }
        x = x1;
      }
    }
    return out;
  }

  function build(){
    const rect = hero.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sweep.width = W * dpr;
    sweep.height = H * dpr;
    sweep.style.width = W + 'px';
    sweep.style.height = H + 'px';
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // cover-fit the glitter source into the hero, same as object-fit: cover
    const s = Math.max(W / src.naturalWidth, H / src.naturalHeight);
    const dw = src.naturalWidth * s, dh = src.naturalHeight * s;
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, W, H);
    octx.drawImage(src, (W - dw) / 2, (H - dh) / 2, dw, dh);
    items = buildGlitter(octx.getImageData(0, 0, W, H).data);
  }

  function updateText(){
    centerEl.style.opacity = smooth(0.85, 1, p);     // the sentence comes up once the glitter is gone
  }

  function drawGlitter(time){
    const amp = 1.5 + 9 * p;                  // jitter grows as you scroll
    const alpha = 1 - 0.35 * p;
    ctx.fillStyle = 'rgba(17,17,17,' + alpha + ')';
    const sparks = [];
    for (let i = 0; i < items.length; i++) {
      const q = items[i];
      if (q.t <= p) continue;                 // dissolved away
      if (q.kind === 'bar') {
        let dx = Math.sin(time * q.f + q.ph) * amp * 0.6;
        if (Math.sin(time * 0.9 + q.band) > 0.985) dx += amp * 3;
        ctx.fillRect(q.x + dx, q.y, q.w, q.h);
        continue;
      }
      const x = q.x + Math.sin(time * q.f1 + q.ph) * amp;
      const y = q.y + Math.cos(time * q.f2 + q.ph * 1.3) * amp;
      if (q.sparkle && Math.sin(time * 6 + q.ph) > 0.92) {
        sparks.push(x, y);
        continue;
      }
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    if (sparks.length) {
      ctx.fillStyle = '#ff0000';
      for (let i = 0; i < sparks.length; i += 2) {
        ctx.fillRect(sparks[i], sparks[i + 1], 2.4, 2.4);
      }
    }
  }

  function rowSize(){ return Math.max(2, Math.round(W / 500)); }

  // each streak row turns black at its own moment, in bands, as in the header
  function rowThreshold(y, row){
    const band = Math.floor(y / (row * 9));
    return (0.6 * hash(band) + 0.4 * hash(y + 1000)) * 0.75;
  }

  // Phase 2: the first animation run in reverse. The glitter bars and dots come
  // back in dark, jittering harder, and black streaks sweep in row by row from
  // alternating edges, until the whole screen is black.
  function drawBlackout(c, time){
    sctx.clearRect(0, 0, W, H);
    if (c <= 0) return;
    if (c >= 1) {                                   // the end state is solid black
      sctx.fillStyle = '#000000';
      sctx.fillRect(0, 0, W, H);
      return;
    }
    const amp = 1.5 + 6 * c;

    sctx.fillStyle = '#111111';
    for (let i = 0; i < items.length; i++) {
      const q = items[i];
      if (q.t > c) continue;                        // not back yet
      if (q.kind === 'bar') {
        let dx = Math.sin(time * q.f + q.ph) * amp * 0.6;
        if (Math.sin(time * 0.9 + q.band) > 0.985) dx += amp * 3;
        sctx.fillRect(q.x + dx, q.y, q.w, q.h);
        continue;
      }
      const x = q.x + Math.sin(time * q.f1 + q.ph) * amp;
      const y = q.y + Math.cos(time * q.f2 + q.ph * 1.3) * amp;
      sctx.fillRect(x, y, 1.6, 1.6);
    }

    const row = rowSize();
    sctx.fillStyle = '#000000';
    for (let y = 0; y < H; y += row) {
      const band = Math.floor(y / (row * 9));
      const rt = rowThreshold(y, row);
      const k = smooth(rt, rt + 0.25, c);
      if (k <= 0) continue;
      const w = W * k;
      const x = (band % 2 ? W - w : 0) + Math.sin(time * 0.9 + band) * amp * 0.6;
      sctx.fillRect(x, y, w, row * 0.9);
    }
  }

  function draw(time){
    updateText();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    if (p < 1) drawGlitter(time);
    drawBlackout(pix, time);
  }

  function frame(now){
    p += (pTarget - p) * 0.1;
    if (Math.abs(pTarget - p) < 0.0005) p = pTarget;
    draw(now / 1000);
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if (!running && visible && !reduce) {
      running = true;
      raf = requestAnimationFrame(frame);
    }
  }

  function stop(){
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function onScroll(){
    const vh = window.innerHeight;
    const y = window.scrollY;
    pTarget = Math.min(1, Math.max(0, y / (vh * 3)));            // phase 1: glitter dissolves over 3 screens
    pix = Math.min(1, Math.max(0, (y - vh * 4) / (vh * 2)));     // phase 2: after the sentence rests one screen, 2 screens of glitter sweep it to black
    if (reduce) {
      p = pTarget;
      draw(0);
    }
  }

  function onResize(){
    if (!isReady) return;
    build();
    if (reduce) { p = pTarget; draw(0); }
  }

  function onLoaded(){
    if (isReady) return;
    isReady = true;
    build();
    onScroll();
    if (reduce) { draw(0); } else { start(); }
  }

  src.onload = onLoaded;  src.onerror = onLoaded;

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onResize);

  // Pause the animation while the hero is off screen.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(entries){
      visible = entries[0].isIntersecting;
      if (visible) start(); else stop();
    }).observe(hero);
  }
})();
</script>

</body>
</html>
